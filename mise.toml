# omarchy-plugin-gate — tasks
#
# The gate itself needs only the system python3 and git. uv is for development:
# it installs the locked test, lint and type-check tools into .venv.

[tools]
uv = "0.13"

[env]
# Develop and test on the Python the gate actually runs on: Omarchy's.
UV_PYTHON_PREFERENCE = "only-system"

# Install / update the command, reviewer agent and nightly timer.
[tasks.install]
description = "Install the command, reviewer agent and nightly timer for this user"
run = "scripts/install.sh"

[tasks."install:no-timer"]
description = "Install without enabling the nightly check"
run = "scripts/install.sh --no-timer"

[tasks.uninstall]
description = "Remove the command, agent and timer (keeps clones and evidence)"
run = "scripts/uninstall.sh"

# Day to day.
[tasks.check]
description = "Review upstream changes for every cloned plugin"
run = "bin/omarchy-plugin-gate check"

[tasks.approve]
description = "Approve one held candidate by hand, after reading its evidence"
run = "bin/omarchy-plugin-gate approve"

[tasks.update]
description = "Apply approved commits to the installed plugins"
run = "bin/omarchy-plugin-gate update"

[tasks.status]
description = "Show installed, approved, upstream and held state"
run = "bin/omarchy-plugin-gate status"

[tasks.doctor]
description = "Verify the wiring; pass --fix to install missing hooks"
run = "bin/omarchy-plugin-gate doctor"

# Development.
[tasks.sync]
description = "Install the locked development tools (pytest, ruff, ty) into .venv"
run = "uv sync --locked"

[tasks."test:unit"]
description = "Unit tests"
run = "uv run --locked pytest"

[tasks."test:fixture"]
description = "Fixture suite (no network, no real install)"
run = "tests/run"

[tasks.test]
description = "Run every test"
depends = ["test:unit", "test:fixture"]

[tasks.fmt]
description = "Format the code and apply safe lint fixes"
run = [
  "uv run --locked ruff format src tests/unit bin/omarchy-plugin-gate scripts/paths.py",
  "uv run --locked ruff check --fix src tests/unit bin/omarchy-plugin-gate scripts/paths.py",
]

[tasks.lint]
description = "Format check, lint, type check, shell syntax"
run = [
  "uv run --locked ruff format --check src tests/unit bin/omarchy-plugin-gate scripts/paths.py",
  "uv run --locked ruff check src tests/unit bin/omarchy-plugin-gate scripts/paths.py",
  "uv run --locked ty check",
  "for f in scripts/install.sh scripts/uninstall.sh tests/run tests/lib/*.sh tests/suites/*.sh tests/stubs/* completions/omarchy-plugin-gate.bash; do bash -n \"$f\" || exit 1; done",
  "if command -v zsh >/dev/null 2>&1; then zsh -n completions/_omarchy-plugin-gate; fi",
  "if command -v fish >/dev/null 2>&1; then fish --no-execute completions/omarchy-plugin-gate.fish; fi",
]
