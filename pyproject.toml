[project]
name = "omarchy-plugin-gate"
version = "0.3.0"
description = "Review Omarchy shell plugin updates before they land"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
# The gate runs on the system Python with the standard library only. Keep it
# that way: bin/omarchy-plugin-gate is a launcher, not an installed package.
dependencies = []

[dependency-groups]
# Exact pins live in uv.lock. ty is pre-1.0, so upgrade it deliberately.
dev = [
  "pytest>=9.2",
  "ruff>=0.17",
  "ty>=0.0.94",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests/unit"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PTH", "RUF", "BLE"]
ignore = [
  # Every command runs through proc.run with a fixed argument list and no
  # shell; these two flag that pattern itself.
  "S603",
  "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/unit/**" = ["S101", "S108"]

[tool.ty.environment]
python-version = "3.14"
root = ["src", "tests/unit"]

[tool.ty.src]
include = ["src", "tests/unit", "scripts/paths.py"]

[tool.ty.terminal]
error-on-warning = true
